# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    strategy:
      matrix:
        # see https://nodejs.org/en/about/previous-releases for active releases
        # https://github.com/nodejs/release#release-schedule
        node-version: [18.x, 20.x, 22.x, lts/*, latest]

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: make github-ci
        env:
          TEST_CONFIGURATION_ACCESS_TOKEN: ${{ secrets.TEST_CONFIGURATION_ACCESS_TOKEN }}
      - name: Upload coverage report
        if: matrix.node-version == 'lts/*'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage/coverage-badge.json
            coverage/coverage-summary.json
            coverage/lcov.info

  snippets:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6
      - name: Use latest Node.js
        uses: actions/setup-node@v6
        with:
          node-version: latest
          cache: "npm"
      - run: make github-ci-snippets
        env:
          TEST_CONFIGURATION_ACCESS_TOKEN: ${{ secrets.TEST_CONFIGURATION_ACCESS_TOKEN }}

  publish-coverage:
    name: Publish coverage
    needs: build
    # Only pushes to the default branch publish, and only once the GitHub App for
    # the test-coverage repository is configured (COVERAGE_APP_CLIENT_ID variable).
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.COVERAGE_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage
      - name: Get a token for the test-coverage repository
        id: coverage-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.COVERAGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.COVERAGE_APP_PRIVATE_KEY }}
          owner: aspose-barcode-cloud
          repositories: test-coverage
          permission-contents: write
      - name: Publish to test-coverage
        run: python scripts/publish-coverage.py node
        env:
          COVERAGE_TOKEN: ${{ steps.coverage-token.outputs.token }}
          COVERAGE_APP_SLUG: ${{ steps.coverage-token.outputs.app-slug }}
