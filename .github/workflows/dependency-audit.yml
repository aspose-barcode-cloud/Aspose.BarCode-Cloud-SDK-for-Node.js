name: Dependency audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dependency-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Use LTS Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "npm"
      - name: Audit dependencies
        run: npm audit --package-lock-only --audit-level=high
