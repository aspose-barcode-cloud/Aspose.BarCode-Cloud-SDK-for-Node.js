name: Publish Package

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  publish:
    name: Publish to npm
    permissions:
      id-token: write # OIDC trusted publishing to npm
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # release workflow must not read the Actions cache
      - run: npm ci
      - run: npm publish
